<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atin's Amazing Word-Guessing Game!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #1f2a44;
            --ink-soft: #55607a;
            --page: #e6ecf3;
            --paper: #ffffff;
            --rule: #d5dde8;
            --blank: #b9c5d6;
            --blue-pen: #2b59c3;
            --red-pen: #d1495b;
            --highlighter: #ffe066;
            --radius: 10px;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--page);
            color: var(--ink);
            font-family: 'Atkinson Hyperlegible', Verdana, Arial, sans-serif;
            font-size: clamp(17px, 1.1vw, 24px);
            line-height: 1.5;
        }

        .wrap {
            max-width: 980px;
            margin: 0 auto;
            padding: 28px 20px 48px;
        }

        header {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 16px;
            margin-bottom: 22px;
        }
        header .logo-left { justify-self: start; }
        header .logo-right { justify-self: end; }

        h1 {
            margin: 0;
            font-size: clamp(1.5rem, 3.4vw, 2.2rem);
            font-weight: 700;
            letter-spacing: -0.01em;
            line-height: 1.15;
            text-align: center;
        }

        header img { height: 44px; width: auto; display: block; }

        .sheet {
            background: var(--paper);
            border-radius: var(--radius);
            box-shadow: 0 1px 0 var(--rule), 0 12px 32px -18px rgba(31, 42, 68, 0.35);
            padding: clamp(18px, 4vw, 40px);
        }

        label.intro {
            display: block;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .hint { color: var(--ink-soft); margin: 0 0 14px; font-size: 0.95rem; }

        textarea, input[type="text"] {
            width: 100%;
            font: inherit;
            color: var(--ink);
            background: #f6f8fb;
            border: 2px solid var(--rule);
            border-radius: var(--radius);
            padding: 12px 14px;
            transition: border-color 0.15s, background 0.15s;
        }

        textarea { min-height: 200px; resize: vertical; line-height: 1.6; }

        textarea:focus, input[type="text"]:focus {
            outline: none;
            border-color: var(--blue-pen);
            background: #fff;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 16px;
        }

        button {
            font: inherit;
            font-weight: 700;
            border-radius: var(--radius);
            padding: 11px 20px;
            cursor: pointer;
            border: 2px solid var(--ink);
            background: var(--ink);
            color: #fff;
            transition: background 0.15s, color 0.15s, transform 0.05s;
        }

        button:hover { background: #2f3d5f; border-color: #2f3d5f; }
        button:active { transform: translateY(1px); }

        button.ghost { background: transparent; color: var(--ink); }
        button.ghost:hover { background: #eef2f7; }

        button:disabled, button:disabled:hover {
            background: var(--rule); border-color: var(--rule); color: var(--ink-soft); cursor: default; transform: none;
        }
        button.ghost:disabled { background: transparent; }

        button:focus-visible, a:focus-visible {
            outline: 3px solid var(--highlighter);
            outline-offset: 2px;
        }

        #share-link { margin-top: 14px; }
        #share-link:empty { display: none; }
        .share-box {
            background: #f6f8fb;
            border: 2px dashed var(--rule);
            border-radius: var(--radius);
            padding: 12px 14px;
        }
        .share-box input { margin: 8px 0 0; font-size: 0.9rem; }
        .share-box a { color: var(--blue-pen); font-weight: 700; }
        .error { color: var(--red-pen); font-weight: 700; }

        /* Game */
        .progress-row {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 22px;
        }
        .progress {
            flex: 1;
            height: 10px;
            background: #eef2f7;
            border-radius: 999px;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            width: 0;
            background: var(--blue-pen);
            border-radius: 999px;
            transition: width 0.4s ease;
        }
        #stats { font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }

        #masked-paragraph {
            font-size: 1.35rem;
            line-height: 2.1;
            white-space: pre-wrap;
            overflow-wrap: break-word;
            text-align: center;
            margin: 0 0 26px;
        }

        .w { white-space: nowrap; }

        /* ---------- Display mode: PCs, laptops, classroom screens ----------
           While a game is running the page fills the window, and the text is
           automatically sized as large as possible without scrolling. */
        @media (min-width: 700px) and (min-height: 500px) {
            body.playing { height: 100vh; height: 100dvh; overflow: hidden; }
            body.playing .wrap {
                max-width: none;
                height: 100%;
                padding: 1.6vh 2.5vw 2.2vh;
                display: flex;
                flex-direction: column;
            }
            body.playing header { margin-bottom: 1.4vh; }
            body.playing h1 { font-size: clamp(1.1rem, 1.5vw, 2.2rem); }
            body.playing header img { height: clamp(36px, 5vh, 72px); }
            body.playing .sheet {
                flex: 1;
                min-height: 0;
                display: flex;
                flex-direction: column;
                padding: 2.2vh 2.5vw;
            }
            body.playing #game-section {
                flex: 1;
                min-height: 0;
                display: flex;
                flex-direction: column;
            }
            body.playing #game-section[hidden] { display: none; }
            body.playing .progress-row { margin-bottom: 1.6vh; }
            body.playing .listen-bar { margin-bottom: 1.4vh; }
            body.playing #masked-paragraph {
                flex: 1;
                min-height: 0;
                overflow-y: auto;
                margin: 0 0 1.6vh;
                line-height: 1.95;
                display: flex;
                flex-direction: column;
            }
            /* Centres the text vertically when there's spare room,
               without hiding the top if it ever overflows. */
            body.playing .para-inner { margin: auto 0; }
        }

        .tools { display: flex; gap: 6px; flex-shrink: 0; }
        .tools button {
            padding: 4px 12px;
            font-size: 0.9em;
            min-width: 2.6em;
        }

        .bottom { flex-shrink: 0; }

        /* ---------- Listening ---------- */
        .listen-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 8px 10px;
            margin: 0 0 18px;
            flex-shrink: 0;
        }
        .listen-bar[hidden] { display: none; }
        .listen-bar button { padding: 6px 14px; font-size: 0.95em; display: inline-flex; align-items: center; gap: 6px; }
        .listen-bar svg { width: 1em; height: 1em; fill: currentColor; flex-shrink: 0; }
        #listen-play { min-width: 7.2em; justify-content: center; }
        .seg {
            display: inline-flex;
            border: 2px solid var(--ink);
            border-radius: var(--radius);
            overflow: hidden;
        }
        .seg button { border: 0; border-radius: 0; background: transparent; color: var(--ink); padding: 6px 12px; }
        .seg button:hover { background: #eef2f7; border: 0; }
        .seg button.on, .seg button.on:hover { background: var(--ink); color: #fff; }
        .seg-label { color: var(--ink-soft); font-size: 0.9em; margin-right: -4px; }
        #voice-select {
            font: inherit;
            font-size: 0.85em;
            color: var(--ink);
            background: #f6f8fb;
            border: 2px solid var(--rule);
            border-radius: var(--radius);
            padding: 6px 8px;
            max-width: 15em;
        }
        .edge-tip {
            flex-basis: 100%;
            text-align: center;
            color: var(--ink-soft);
            font-size: 0.85em;
        }
        .edge-tip[hidden] { display: none; }
        .edge-tip button {
            background: none; border: 0; color: var(--ink-soft);
            padding: 0 6px; font-size: 1.1em; vertical-align: middle;
        }
        .edge-tip button:hover { background: none; color: var(--ink); border: 0; }
        .sent.reading {
            background: rgba(255, 224, 102, 0.55);
            border-radius: 6px;
            /* Vertical padding doesn't move the text; it just stretches the
               band down to cover the blank lines. */
            padding: 0.02em 0 0.32em;
            -webkit-box-decoration-break: clone;
            box-decoration-break: clone;
        }
        .option {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 12px;
            cursor: pointer;
        }
        .option input { width: 1.15em; height: 1.15em; accent-color: var(--ink); }
        .guess-bar .ghost { white-space: nowrap; }

        .blank {
            display: inline-block;
            width: 0.58em;
            margin: 0 0.06em;
            border-bottom: 3px solid var(--blank);
            line-height: 1;
            vertical-align: -0.12em;
        }

        .found { color: var(--blue-pen); font-weight: 700; }
        .given { color: var(--red-pen); font-weight: 700; }

        .just-found {
            background-image: linear-gradient(var(--highlighter), var(--highlighter));
            background-repeat: no-repeat;
            background-position: 0 85%;
            background-size: 100% 45%;
            animation: sweep 0.45s ease-out;
            border-radius: 3px;
        }
        @keyframes sweep { from { background-size: 0% 45%; } to { background-size: 100% 45%; } }

        .guess-bar {
            display: flex;
            gap: 10px;
            border-top: 2px solid #eef2f7;
            padding-top: 20px;
        }
        .guess-bar input { flex: 1; min-width: 0; font-size: 1.15em; }
        .guess-bar .spacer { width: 10px; }

        #feedback { min-height: 1.6em; margin: 12px 0 4px; font-weight: 700; }
        #feedback.good { color: var(--blue-pen); }
        #feedback.bad { color: var(--red-pen); }
        #feedback.meh { color: var(--ink-soft); }

        #incorrect-guesses { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; margin: 6px 0 0; }
        #incorrect-guesses:empty { display: none; }
        #incorrect-guesses .label { color: var(--ink-soft); font-size: 0.95rem; }
        #incorrect-guesses .miss {
            color: var(--red-pen);
            text-decoration: line-through;
            text-decoration-thickness: 2px;
        }

        #completion-message {
            margin: 18px 0 0;
            padding: 14px 18px;
            border-radius: var(--radius);
            font-weight: 700;
            font-size: 1.15rem;
        }
        #completion-message.win { background: #e3ecff; color: var(--blue-pen); }
        #completion-message.given-up { background: #fde8eb; color: var(--red-pen); }


        @media (max-width: 560px) {
            header { gap: 10px; }
            header img { height: 34px; }
            .progress-row { flex-wrap: wrap; row-gap: 10px; }
            .progress { flex-basis: 100%; }
            #stats { flex: 1; }
            #fullscreen { display: none; }
            .guess-bar { flex-wrap: wrap; }
            .guess-bar input { flex-basis: 100%; }
            .guess-bar button { flex: 1; padding: 11px 12px; white-space: nowrap; }
            .guess-bar .spacer { display: none; }
            .actions button { flex: 1; padding: 11px 12px; white-space: nowrap; }
            .listen-bar { justify-content: flex-start; }
            #voice-select { max-width: 100%; flex-basis: 100%; }
        }

        @media (prefers-reduced-motion: reduce) {
            .just-found { animation: none; }
            .progress-bar { transition: none; }
        }
    </style>
</head>
<body>
<div class="wrap">
    <header>
        <img src="madebyatinlogo.png" class="logo-left" alt="Made by Atin">
        <h1>Atin's Amazing Word-Guessing Game!</h1>
        <img src="newcitycollegelogo.png" class="logo-right" alt="New City College">
    </header>

    <main class="sheet">
        <div id="setup-section">
            <label class="intro" for="paragraph-input">Paste a paragraph</label>
            <p class="hint">Every word is hidden. Students guess words one at a time to fill in the text.</p>
            <textarea id="paragraph-input" placeholder="Type or paste your text here…"></textarea>
            <label class="option"><input type="checkbox" id="include-audio" checked> Include listening (students can hear the text read aloud)</label>
            <div class="actions">
                <button id="start-game">Start game</button>
                <button id="share-game" class="ghost">Share game</button>
            </div>
        </div>
        <div id="share-link"></div>

        <div id="game-section" hidden>
            <div class="progress-row">
                <div class="progress" aria-hidden="true"><div class="progress-bar" id="progress-bar"></div></div>
                <div id="stats"></div>
                <div class="tools">
                    <button id="text-smaller" class="ghost" title="Smaller text" aria-label="Smaller text">A−</button>
                    <button id="text-larger" class="ghost" title="Larger text" aria-label="Larger text">A+</button>
                    <button id="fullscreen" class="ghost" title="Full screen" aria-label="Full screen">⛶</button>
                </div>
            </div>

            <div class="listen-bar" id="listen-bar" hidden>
                <button id="listen-play"></button>
                <button id="listen-back" class="ghost" title="Back one sentence">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h2.5v14H6zM20 5v14L9.5 12z"/></svg>Back
                </button>
                <button id="listen-restart" class="ghost" title="Start again from the beginning">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V1.5L7 6.5l5 5V8a5 5 0 1 1-5 5H4.5A7.5 7.5 0 1 0 12 5z"/></svg>Restart
                </button>
                <div class="seg" role="group" aria-label="Speed">
                    <button data-rate="1" class="on">Normal</button>
                    <button data-rate="0.75">Slower</button>
                </div>
                <div class="seg" role="group" aria-label="Level">
                    <button data-mode="easy" class="on" title="Highlights the sentence being read">Easy</button>
                    <button data-mode="hard" title="No highlight">Hard</button>
                </div>
                <select id="voice-select" aria-label="Voice"></select>
                <div class="edge-tip" id="edge-tip" hidden>
                    For a better voice, open this page in Microsoft Edge.
                    <button id="edge-tip-close" title="Hide this tip" aria-label="Hide this tip">×</button>
                </div>
            </div>

            <div id="masked-paragraph" aria-live="polite"></div>

            <div class="bottom">
                <div class="guess-bar">
                    <input type="text" id="guess-input" placeholder="Type a word and press Enter"
                           aria-label="Your guess"
                           autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
                    <button id="submit-guess">Guess</button>
                    <span class="spacer"></span>
                    <button id="reveal-all" class="ghost">Reveal answer</button>
                    <button id="new-game" class="ghost">New game</button>
                </div>
                <div id="feedback" role="status"></div>
                <div id="incorrect-guesses"></div>
                <div id="completion-message" hidden></div>
            </div>
        </div>
    </main>
</div>

<script>
    const setupSection = document.getElementById('setup-section');
    const paragraphInput = document.getElementById('paragraph-input');
    const startGameBtn = document.getElementById('start-game');
    const shareGameBtn = document.getElementById('share-game');
    const shareLinkDiv = document.getElementById('share-link');
    const gameSection = document.getElementById('game-section');
    const statsDiv = document.getElementById('stats');
    const progressBar = document.getElementById('progress-bar');
    const maskedParagraphDiv = document.getElementById('masked-paragraph');
    const guessInput = document.getElementById('guess-input');
    const submitGuessBtn = document.getElementById('submit-guess');
    const revealAllBtn = document.getElementById('reveal-all');
    const newGameBtn = document.getElementById('new-game');
    const feedbackDiv = document.getElementById('feedback');
    const incorrectGuessesDiv = document.getElementById('incorrect-guesses');
    const completionMessage = document.getElementById('completion-message');
    const textSmallerBtn = document.getElementById('text-smaller');
    const textLargerBtn = document.getElementById('text-larger');
    const fullscreenBtn = document.getElementById('fullscreen');

    // ---------- Text sizing ----------
    // On PCs and classroom displays the paragraph is sized to fill the space
    // available. On phones it uses a fixed readable size and scrolls.
    // A− / A+ adjust either of these by 15% steps.
    let userScale = 1;
    let fitQueued = false;

    function isDisplayMode() {
        return window.matchMedia('(min-width: 700px) and (min-height: 500px)').matches;
    }

    function fitText() {
        fitQueued = false;
        if (gameSection.hidden) return;
        const el = maskedParagraphDiv;

        if (!isDisplayMode()) {
            el.style.fontSize = (21 * userScale) + 'px';
            return;
        }

        // Binary search for the largest size that fits without scrolling.
        // Capped so a single short sentence doesn't become absurdly huge.
        let lo = 14;
        let hi = Math.max(28, Math.min(window.innerWidth / 12, window.innerHeight / 5));
        for (let i = 0; i < 14; i++) {
            const mid = (lo + hi) / 2;
            el.style.fontSize = mid + 'px';
            if (el.scrollHeight <= el.clientHeight + 1 && el.scrollWidth <= el.clientWidth + 1) lo = mid;
            else hi = mid;
        }
        el.style.fontSize = (lo * userScale) + 'px';
    }

    function queueFit() {
        if (fitQueued) return;
        fitQueued = true;
        requestAnimationFrame(fitText);
    }

    window.addEventListener('resize', queueFit);
    document.addEventListener('fullscreenchange', () => {
        fullscreenBtn.title = document.fullscreenElement ? 'Exit full screen' : 'Full screen';
        queueFit();
    });
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(queueFit);

    textSmallerBtn.addEventListener('click', () => { userScale = Math.max(0.4, userScale / 1.15); fitText(); });
    textLargerBtn.addEventListener('click', () => { userScale = Math.min(3, userScale * 1.15); fitText(); });

    fullscreenBtn.addEventListener('click', () => {
        if (!document.fullscreenEnabled) return;
        if (document.fullscreenElement) document.exitFullscreen();
        else document.documentElement.requestFullscreen().catch(() => {});
    });

    // A "word" is a run of letters/digits in any alphabet (é, ñ, ç count),
    // optionally joined by apostrophes (straight or curly). Hyphens split
    // words: "well-known" is two words, with the hyphen shown as a clue.
    const WORD_RE = /[\p{L}\p{M}\p{N}]+(?:['’‘ʼ][\p{L}\p{M}\p{N}]+)*/gu;
    const IS_LETTER = /[\p{L}\p{M}\p{N}]/u;

    let originalParagraph = '';
    let tokens = [];
    let incorrectGuesses = [];
    let gameOver = false;

    // Compare ignoring case, accents, apostrophes and hyphens:
    // "dont" = "don't" = "don’t", "jose" = "José".
    function normalizeWord(word) {
        return word.normalize('NFD').replace(/\p{M}/gu, '').toLowerCase().replace(/[^\p{L}\p{N}]/gu, '');
    }

    function tokenise(text) {
        const result = [];
        let last = 0;
        for (const m of text.matchAll(WORD_RE)) {
            if (m.index > last) result.push({ text: text.slice(last, m.index), word: false });
            result.push({ text: m[0], word: true, key: normalizeWord(m[0]), found: false, given: false });
            last = m.index + m[0].length;
        }
        if (last < text.length) result.push({ text: text.slice(last), word: false });
        return result;
    }

    // Hidden words are drawn as one blank line per letter. The real letters are
    // never put on the page, so they can't be copied or found by inspecting.
    function maskedWordNode(word) {
        const span = document.createElement('span');
        span.className = 'w';
        span.setAttribute('aria-label', 'hidden word');
        for (const ch of word) {
            if (IS_LETTER.test(ch)) {
                const b = document.createElement('span');
                b.className = 'blank';
                b.textContent = '\u00a0';
                span.appendChild(b);
            } else {
                span.appendChild(document.createTextNode(ch));
            }
        }
        return span;
    }

    function updateDisplay(justFoundKey) {
        maskedParagraphDiv.textContent = '';
        const inner = document.createElement('div');
        inner.className = 'para-inner';
        // Each sentence gets its own span so the one being read can be highlighted.
        const sentSpans = [];
        for (const t of tokens) {
            let frag = sentSpans[t.sent];
            if (!frag) {
                frag = sentSpans[t.sent] = document.createElement('span');
                frag.className = 'sent';
                frag.dataset.s = t.sent;
                inner.appendChild(frag);
            }
            if (!t.word) {
                frag.appendChild(document.createTextNode(t.text));
            } else if (t.found || t.given) {
                const span = document.createElement('span');
                span.textContent = t.text;
                span.className = t.given ? 'given' : 'found';
                if (justFoundKey && t.key === justFoundKey) span.classList.add('just-found');
                frag.appendChild(span);
            } else {
                frag.appendChild(maskedWordNode(t.text));
            }
        }
        maskedParagraphDiv.appendChild(inner);
        applyHighlight();

        const words = tokens.filter(t => t.word);
        const found = words.filter(t => t.found).length;
        statsDiv.textContent = `${found} of ${words.length} words`;
        progressBar.style.width = words.length ? (found / words.length * 100) + '%' : '0';

        if (!gameOver && words.length && words.every(t => t.found)) {
            gameOver = true;
            setPlaying(false);
            showCompletion("🎉 Yay! You've guessed all the words!", 'win');
            feedbackDiv.textContent = '';
        }
        fitText();
    }

    function showCompletion(text, kind) {
        completionMessage.textContent = text;
        completionMessage.className = kind;
        completionMessage.hidden = false;
    }

    function setFeedback(text, kind) {
        feedbackDiv.textContent = text;
        feedbackDiv.className = kind || '';
    }

    function renderIncorrect() {
        incorrectGuessesDiv.textContent = '';
        if (!incorrectGuesses.length) return;
        const label = document.createElement('span');
        label.className = 'label';
        label.textContent = 'Not in the text:';
        incorrectGuessesDiv.appendChild(label);
        incorrectGuesses.forEach(g => {
            const s = document.createElement('span');
            s.className = 'miss';
            s.textContent = g;
            incorrectGuessesDiv.appendChild(s);
        });
    }

    function setPlaying(playing) {
        guessInput.disabled = !playing;
        submitGuessBtn.disabled = !playing;
        revealAllBtn.disabled = !playing;
    }

    function handleGuess() {
        if (gameOver) return;
        const raw = guessInput.value.trim();
        const guess = normalizeWord(raw);
        guessInput.value = '';
        guessInput.focus();
        if (!guess) return;

        const matches = tokens.filter(t => t.word && t.key === guess);

        if (matches.length === 0) {
            if (incorrectGuesses.includes(guess)) {
                setFeedback(`You already tried "${raw}".`, 'meh');
            } else {
                incorrectGuesses.push(guess);
                renderIncorrect();
                setFeedback(`"${raw}" isn't in the text.`, 'bad');
            }
            updateDisplay();
            return;
        }

        if (matches.every(t => t.found)) {
            setFeedback(`You already found "${raw}".`, 'meh');
            updateDisplay();
            return;
        }

        matches.forEach(t => { t.found = true; });
        setFeedback(matches.length > 1
            ? `Yes! "${raw}" appears ${matches.length} times.`
            : `Yes! "${raw}" is in the text.`, 'good');
        updateDisplay(guess);
    }

    function startGame(text, withAudio = true) {
        originalParagraph = text.normalize('NFC');
        tokens = tokenise(originalParagraph);
        buildSentences();
        audioWanted = withAudio;
        if (!tokens.some(t => t.word)) {
            showShareMessage('There are no words in that text.', true);
            return;
        }
        incorrectGuesses = [];
        gameOver = false;
        renderIncorrect();
        setFeedback('');
        completionMessage.hidden = true;
        setupSection.hidden = true;
        shareLinkDiv.textContent = '';
        document.body.classList.add('playing');
        gameSection.hidden = false;
        setPlaying(true);
        updateDisplay();
        stopSpeech();
        refreshListenBar();
        guessInput.focus();
    }

    // Share links hold the paragraph base64-encoded so the answer
    // can't be read straight off the address bar.
    function encodeText(text) {
        const bytes = new TextEncoder().encode(text);
        let bin = '';
        bytes.forEach(b => { bin += String.fromCharCode(b); });
        return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }

    function decodeText(code) {
        let b64 = code.replace(/-/g, '+').replace(/_/g, '/');
        while (b64.length % 4) b64 += '=';
        const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
        return new TextDecoder('utf-8', { fatal: true }).decode(bytes);
    }

    function showShareMessage(message, isError) {
        shareLinkDiv.textContent = '';
        const p = document.createElement('div');
        p.textContent = message;
        if (isError) p.className = 'error';
        shareLinkDiv.appendChild(p);
    }

    function showShareLink(url, copied) {
        shareLinkDiv.textContent = '';
        const box = document.createElement('div');
        box.className = 'share-box';
        const msg = document.createElement('div');
        msg.textContent = copied ? 'Link copied. ' : 'Copy this link: ';
        const a = document.createElement('a');
        a.href = url; a.target = '_blank'; a.rel = 'noopener';
        a.textContent = 'Open game';
        msg.appendChild(a);
        const input = document.createElement('input');
        input.type = 'text'; input.readOnly = true; input.value = url;
        input.setAttribute('aria-label', 'Share link');
        input.addEventListener('focus', () => input.select());
        box.appendChild(msg);
        box.appendChild(input);
        shareLinkDiv.appendChild(box);
        if (!copied) input.select();
    }

    startGameBtn.addEventListener('click', () => {
        const text = paragraphInput.value.trim();
        if (!text) { showShareMessage('Type or paste a paragraph first.', true); return; }
        startGame(text, includeAudioBox.checked);
    });

    shareGameBtn.addEventListener('click', () => {
        const text = paragraphInput.value.trim() || originalParagraph;
        if (!text) { showShareMessage('Type or paste a paragraph first.', true); return; }
        const url = `${window.location.origin}${window.location.pathname}?p=${encodeText(text.normalize('NFC'))}${includeAudioBox.checked ? '' : '&a=0'}`;
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(url).then(() => showShareLink(url, true)).catch(() => showShareLink(url, false));
        } else {
            showShareLink(url, false);
        }
    });

    revealAllBtn.addEventListener('click', () => {
        if (gameOver) return;
        if (!confirm('Reveal all the words and end the game?')) return;
        tokens.forEach(t => { if (t.word && !t.found) t.given = true; });
        gameOver = true;
        setPlaying(false);
        setFeedback('');
        showCompletion('Answer revealed. Words in red were not guessed.', 'given-up');
        updateDisplay();
    });

    newGameBtn.addEventListener('click', () => { stopSpeech(); window.location.href = window.location.pathname; });

    submitGuessBtn.addEventListener('click', handleGuess);
    guessInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); handleGuess(); }
    });

    // ---------- Listening ----------
    // Uses the browser's own text-to-speech (free, no account, no limits,
    // nothing stored). Reads one sentence at a time: this avoids Chrome's
    // habit of cutting off long speech and its unreliable pause button.
    const includeAudioBox = document.getElementById('include-audio');
    const listenBar = document.getElementById('listen-bar');
    const playBtn = document.getElementById('listen-play');
    const backBtn = document.getElementById('listen-back');
    const restartBtn = document.getElementById('listen-restart');
    const voiceSelect = document.getElementById('voice-select');
    const rateBtns = listenBar.querySelectorAll('[data-rate]');
    const modeBtns = listenBar.querySelectorAll('[data-mode]');
    const synth = window.speechSynthesis;

    // Chrome on a computer only has Google's voices, which are much less natural
    // than Edge's, so suggest Edge there. (Not on phones or tablets.)
    const edgeTip = document.getElementById('edge-tip');
    function isDesktopChrome() {
        const ua = navigator.userAgent;
        const brands = (navigator.userAgentData && navigator.userAgentData.brands || []).map(b => b.brand);
        const chrome = brands.length ? brands.includes('Google Chrome') : /Chrome\//.test(ua);
        return chrome && !/Edg\/|OPR\/|Android|Mobile/.test(ua);
    }
    const showEdgeTip = isDesktopChrome() && recall('edge-tip') !== 'hidden';
    document.getElementById('edge-tip-close').addEventListener('click', () => {
        edgeTip.hidden = true;
        store('edge-tip', 'hidden');
        queueFit();
    });


    const PLAY_HTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12.5-7.5z"/></svg>Listen';
    const PAUSE_HTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4.5h4v15H6zM14 4.5h4v15h-4z"/></svg>Pause';

    let audioWanted = true;
    let voices = [];
    let chosenVoice = null;
    let rate = 1;
    let easyMode = true;
    let chunks = [];          // [{ sent, text }] – what actually gets spoken
    let pos = 0;              // index into chunks
    let speaking = false;
    let gen = 0;              // bumps on every stop, so stale callbacks are ignored
    let currentUtterance = null; // kept so Chrome doesn't garbage-collect it mid-speech
    let currentSent = null;

    function store(key, value) { try { localStorage.setItem('wordgame-' + key, value); } catch (e) {} }
    function recall(key) { try { return localStorage.getItem('wordgame-' + key); } catch (e) { return null; } }

    // Split the text into sentences and tag every token with its sentence number.
    function buildSentences() {
        let s = 0;
        const texts = [];
        const hasWord = [];
        for (const t of tokens) {
            t.sent = s;
            texts[s] = (texts[s] || '') + t.text;
            if (t.word) hasWord[s] = true;
            if (!t.word && (/[.!?…]["'’”)\]]*\s/.test(t.text) || /\n/.test(t.text))) s++;
        }
        chunks = [];
        texts.forEach((text, i) => {
            if (!hasWord[i]) return;
            splitLong(text.trim()).forEach(part => chunks.push({ sent: i, text: part }));
        });
        pos = 0;
        currentSent = null;
    }

    // Very long sentences are spoken in pieces (at commas where possible),
    // because Chrome's online voices stop after about 15 seconds.
    function splitLong(text, max = 160) {
        if (text.length <= max) return [text];
        const pieces = text.split(/(?<=[,;:—–])\s+/);
        const out = [];
        let cur = '';
        const push = (piece) => {
            if (!cur) cur = piece;
            else if ((cur + ' ' + piece).length <= max) cur += ' ' + piece;
            else { out.push(cur); cur = piece; }
        };
        for (const piece of pieces) {
            if (piece.length <= max) push(piece);
            else piece.split(/\s+/).forEach(push);
        }
        if (cur) out.push(cur);
        return out;
    }

    function voiceScore(v) {
        let score = 0;
        const lang = (v.lang || '').replace('_', '-').toLowerCase();
        if (lang === 'en-gb') score += 100;
        else if (lang.startsWith('en')) score += 10;
        if (/natural|online/i.test(v.name)) score += 50;  // Edge: Sonia, Libby, Ryan
        else if (/google/i.test(v.name)) score += 30;     // Chrome: Google UK English
        if (/female/i.test(v.name)) score += 1;
        return score;
    }

    function loadVoices() {
        if (!synth) return;
        const all = synth.getVoices().filter(v => (v.lang || '').toLowerCase().startsWith('en'));
        if (!all.length) return;
        all.sort((a, b) => voiceScore(b) - voiceScore(a) || a.name.localeCompare(b.name));
        const sameList = voices.length === all.length && voices.every((v, i) => v.name === all[i].name);
        if (sameList) return;
        voices = all;
        const saved = recall('voice');
        chosenVoice = voices.find(v => v.name === saved) || voices[0];
        voiceSelect.textContent = '';
        voices.forEach(v => {
            const o = document.createElement('option');
            o.value = v.name;
            o.textContent = v.name.replace(/^Microsoft\s+/, '').replace(/\s*-\s*English.*$/, '') +
                (v.lang.toLowerCase().replace('_', '-') === 'en-gb' ? ' (UK)' : ' (' + v.lang + ')');
            if (v === chosenVoice) o.selected = true;
            voiceSelect.appendChild(o);
        });
        voiceSelect.hidden = voices.length < 2;
        refreshListenBar();
    }

    if (synth) {
        loadVoices();
        if ('onvoiceschanged' in synth) synth.addEventListener('voiceschanged', loadVoices);
        // Some browsers never fire voiceschanged, so check a few times as well.
        let tries = 0;
        const poll = setInterval(() => { loadVoices(); if (voices.length || ++tries > 20) clearInterval(poll); }, 250);
    } else {
        includeAudioBox.closest('label').hidden = true;
    }

    function refreshListenBar() {
        edgeTip.hidden = !showEdgeTip || recall('edge-tip') === 'hidden';
        listenBar.hidden = !(audioWanted && synth && voices.length && !gameSection.hidden);
        playBtn.innerHTML = speaking ? PAUSE_HTML : PLAY_HTML;
        playBtn.title = speaking ? 'Pause' : 'Listen to the text';
        queueFit();
    }

    function applyHighlight() {
        maskedParagraphDiv.querySelectorAll('.sent.reading').forEach(el => el.classList.remove('reading'));
        if (!easyMode || currentSent === null) return;
        const el = maskedParagraphDiv.querySelector(`.sent[data-s="${currentSent}"]`);
        if (el) el.classList.add('reading');
    }

    function setSent(s) { currentSent = s; applyHighlight(); }

    // Chrome sometimes silently drops an utterance that is queued straight
    // after another one finishes: it "ends" instantly without speaking. So we
    // leave a short gap between sentences, and if a sentence ends almost
    // immediately without ever starting, we try it again.
    function speakChunk(i, g, attempt = 0) {
        if (g !== gen) return;
        if (i >= chunks.length) {           // reached the end
            speaking = false; pos = 0; setSent(null); refreshListenBar();
            return;
        }
        pos = i;
        setSent(chunks[i].sent);
        const u = new SpeechSynthesisUtterance(chunks[i].text);
        u.lang = chosenVoice ? chosenVoice.lang : 'en-GB';
        try { if (chosenVoice) u.voice = chosenVoice; } catch (e) { /* fall back to the default voice */ }
        u.rate = rate;
        let started = false;
        const t0 = Date.now();
        const next = () => setTimeout(() => speakChunk(i + 1, g), 250);
        const retry = () => setTimeout(() => speakChunk(i, g, attempt + 1), 300);
        const dropped = () => !started && Date.now() - t0 < 250 && attempt < 2;
        u.onstart = () => { started = true; };
        u.onend = () => {
            if (g !== gen) return;
            if (dropped()) retry(); else next();
        };
        u.onerror = (e) => {
            if (g !== gen || e.error === 'interrupted' || e.error === 'canceled') return;
            if (attempt < 2) retry(); else next();
        };
        currentUtterance = u;
        if (synth.paused) synth.resume();
        synth.speak(u);
    }

    function playFrom(i) {
        if (!synth || !chunks.length) return;
        const g = ++gen;
        synth.cancel();
        speaking = true;
        refreshListenBar();
        // A short gap after cancel(): Chrome sometimes ignores an immediate speak().
        setTimeout(() => speakChunk(i, g), 120);
    }

    // "Pause" stops the current sentence; "Listen" carries on from the start of it.
    function stopSpeech() {
        gen++;
        if (synth) synth.cancel();
        speaking = false;
        currentUtterance = null;
    }

    function backToGuessing() { if (isDisplayMode() && !guessInput.disabled) guessInput.focus(); }

    playBtn.addEventListener('click', () => {
        if (speaking) { stopSpeech(); refreshListenBar(); }
        else playFrom(pos);
        backToGuessing();
    });

    backBtn.addEventListener('click', () => {
        if (!chunks.length) return;
        // Back to the start of the previous sentence (or this one, if nothing has played yet).
        const curSent = chunks[Math.min(pos, chunks.length - 1)].sent;
        const firstOfCur = chunks.findIndex(c => c.sent === curSent);
        let target = firstOfCur;
        if (currentSent !== null && firstOfCur > 0) {
            const prevSent = chunks[firstOfCur - 1].sent;
            target = chunks.findIndex(c => c.sent === prevSent);
        }
        if (speaking) playFrom(target);
        else { pos = target; setSent(chunks[target].sent); }
        backToGuessing();
    });

    restartBtn.addEventListener('click', () => { playFrom(0); backToGuessing(); });

    rateBtns.forEach(b => b.addEventListener('click', () => {
        rate = parseFloat(b.dataset.rate);
        rateBtns.forEach(x => x.classList.toggle('on', x === b));
        store('rate', b.dataset.rate);
        if (speaking) playFrom(pos);
        backToGuessing();
    }));

    modeBtns.forEach(b => b.addEventListener('click', () => {
        easyMode = b.dataset.mode === 'easy';
        modeBtns.forEach(x => x.classList.toggle('on', x === b));
        store('mode', b.dataset.mode);
        applyHighlight();
        backToGuessing();
    }));

    voiceSelect.addEventListener('change', () => {
        chosenVoice = voices.find(v => v.name === voiceSelect.value) || chosenVoice;
        store('voice', voiceSelect.value);
        if (speaking) playFrom(pos);
    });

    // Restore the last speed and level used on this computer.
    (function restoreSettings() {
        const r = recall('rate');
        const rb = r && [...rateBtns].find(b => b.dataset.rate === r);
        if (rb) rb.click();
        const m = recall('mode');
        const mb = m && [...modeBtns].find(b => b.dataset.mode === m);
        if (mb) mb.click();
    })();

    window.addEventListener('pagehide', () => { if (synth) synth.cancel(); });

    window.addEventListener('load', () => {
        const params = new URLSearchParams(window.location.search);
        try {
            if (params.has('p')) {
                startGame(decodeText(params.get('p')), params.get('a') !== '0');
            } else if (params.has('paragraph')) {
                // Old-style links still work (already decoded by URLSearchParams).
                startGame(params.get('paragraph'));
            }
        } catch (err) {
            showShareMessage('This game link is broken or incomplete. Ask your teacher for a new link.', true);
        }
    });
</script>
</body>
</html>
